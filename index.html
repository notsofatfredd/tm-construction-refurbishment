<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TM Construction and Refurbishment — Concept Switcher</title>
<style>
  :root {
    --bg: #0e0e10;
    --bar-bg: #161618;
    --border: #2a2a2e;
    --text: #f2f1ee;
    --text-dim: #9a9a9e;
    --tab-active-bg: #f2f1ee;
    --tab-active-text: #0e0e10;
    --accent: #d9822b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .switcher-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    background: var(--bar-bg);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .switcher-brand {
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.02em;
    margin-right: auto;
    white-space: nowrap;
  }
  .switcher-brand span {
    color: var(--accent);
  }
  .tabs {
    display: flex;
    gap: 6px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px;
  }
  .tab {
    appearance: none;
    border: none;
    background: transparent;
    color: var(--text-dim);
    font-size: 13px;
    font-weight: 600;
    padding: 7px 14px;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .tab:hover {
    color: var(--text);
  }
  .tab[aria-selected="true"] {
    background: var(--tab-active-bg);
    color: var(--tab-active-text);
  }
  .tab:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .open-link {
    font-size: 12px;
    color: var(--text-dim);
    text-decoration: none;
    border: 1px solid var(--border);
    padding: 7px 12px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .open-link:hover {
    color: var(--text);
    border-color: var(--text-dim);
  }
  .frame-wrap {
    position: relative;
    width: 100%;
    height: calc(100% - 53px);
  }
  iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    background: #fff;
  }
  @media (max-width: 640px) {
    .switcher-bar {
      flex-direction: column;
      align-items: stretch;
    }
    .switcher-brand {
      margin-right: 0;
      text-align: center;
    }
    .tabs {
      justify-content: center;
    }
    .open-link {
      text-align: center;
    }
  }
</style>
</head>
<body>
  <div class="switcher-bar">
    <div class="switcher-brand">TM Construction <span>&amp;</span> Refurbishment — Concept Switcher</div>
    <div class="tabs" role="tablist" aria-label="Concept switcher">
      <button class="tab" id="tab-a" role="tab" aria-selected="true" aria-controls="frame" data-src="concept-a-product-launch.html">A · Product Launch</button>
      <button class="tab" id="tab-b" role="tab" aria-selected="false" aria-controls="frame" data-src="concept-b-monograph.html">B · Monograph</button>
      <button class="tab" id="tab-c" role="tab" aria-selected="false" aria-controls="frame" data-src="concept-c-editorial-journal.html">C · Editorial Journal</button>
    </div>
    <a class="open-link" id="open-direct" href="concept-a-product-launch.html" target="_blank" rel="noopener">Open full page ↗</a>
  </div>
  <div class="frame-wrap">
    <iframe id="frame" name="frame" src="concept-a-product-launch.html" title="Concept preview"></iframe>
  </div>

  <script>
    (function () {
      var tabs = Array.prototype.slice.call(document.querySelectorAll('.tab'));
      var frame = document.getElementById('frame');
      var openLink = document.getElementById('open-direct');

      function activate(tab, updateHash) {
        tabs.forEach(function (t) {
          t.setAttribute('aria-selected', t === tab ? 'true' : 'false');
        });
        var src = tab.getAttribute('data-src');
        frame.src = src;
        openLink.href = src;
        if (updateHash !== false) {
          history.replaceState(null, '', '#' + tab.id.replace('tab-', ''));
        }
      }

      tabs.forEach(function (tab) {
        tab.addEventListener('click', function () {
          activate(tab, true);
        });
      });

      var initial = (location.hash || '').replace('#', '');
      var initialTab = tabs.find(function (t) { return t.id === 'tab-' + initial; });
      if (initialTab) {
        activate(initialTab, false);
      }
    })();
  </script>
</body>
</html>
